<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#021427" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" />

  <!-- Tech Hex / Circuit Lines -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Professional Minimal Student Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <!-- Hair / Silhouette Details -->
  <path d="M 150 160 C 150 100, 250 100, 250 160 C 245 130, 220 120, 200 120 C 180 120, 155 130, 150 160 Z" fill="#38bdf8" opacity="0.8" />
  
  <!-- Shoulders -->
  <path d="M 120 270 C 120 215, 160 210, 200 210 C 240 210, 280 215, 280 270 L 280 290 L 120 290 Z" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
  
  <!-- Monogram Badge -->
  <rect x="150" y="300" width="100" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="321" font-family="sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="2">KORADA K.</text>
</svg>
